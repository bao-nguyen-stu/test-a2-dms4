<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableVote — Smart-Casual Group Food Poll</title>
  
  <!-- Google Fonts: Fraunces (Classic Editorial Serif) + Plus Jakarta Sans (Clean UI Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. SMART-CASUAL DESIGN TOKENS
       ========================================= */
    :root {
      --color-primary: #D84315;        /* Burnt Terracotta */
      --color-primary-hover: #BF360C;
      --color-primary-tint: #FBE9E7;   /* Soft Terracotta Fill */
      --color-secondary: #B71C1C;      /* Deep Crimson (Urgency / Timer) */
      --color-secondary-tint: #FFEBEE;
      --color-bg: #FAF7F2;             /* Warm Alabaster Paper */
      --color-surface: #FFFFFF;        /* Crisp Card White */
      --color-text: #1C1917;           /* Deep Espresso Ink */
      --color-muted: #57534E;          /* Warm Stone */
      --color-border: #E7E2DA;         /* Subtle Hairline Border */
      --color-success: #2E6F40;        /* Classic Forest Green */
      --color-success-tint: #EDF5EF;

      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-bottom: 4rem;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       2. TOP PALETTE REFERENCE BAR
       ========================================= */
    .brand-bar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0.65rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.78rem;
    }

    .brand-bar-title {
      font-weight: 600;
      color: var(--color-muted);
      letter-spacing: 0.02em;
    }

    .swatch-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .swatch-btn:hover {
      border-color: var(--color-primary);
    }

    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    /* =========================================
       3. LAYOUT & PRIMARY HIERARCHY (HEADER)
       ========================================= */
    .container {
      max-width: 620px;
      margin: 2.25rem auto 0;
      padding: 0 1.25rem;
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 1.75rem;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-accent {
      color: var(--color-primary);
    }

    .timer-badge {
      background: var(--color-secondary-tint);
      color: var(--color-secondary);
      border: 1px solid rgba(183, 28, 28, 0.2);
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .poll-header {
      margin-bottom: 1.75rem;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-primary);
      margin-bottom: 0.4rem;
    }

    .poll-question {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.22;
      color: var(--color-text);
      letter-spacing: -0.015em;
      margin-bottom: 0.85rem;
    }

    .poll-summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    .summary-strong {
      color: var(--color-text);
      font-weight: 700;
    }

    /* =========================================
       4. SECONDARY & TERTIARY HIERARCHY (CARDS)
       ========================================= */
    .section-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin-bottom: 0.65rem;
      padding: 0 0.25rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-card {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.05rem 1.25rem;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .option-card:hover {
      border-color: #C7BFA9;
      box-shadow: 0 3px 10px rgba(28, 25, 23, 0.04);
    }

    .option-card.selected {
      border: 1.5px solid var(--color-primary);
      box-shadow: 0 4px 14px rgba(216, 67, 21, 0.08);
    }

    /* Subtle progress bar fill */
    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--color-primary-tint);
      opacity: 0.65;
      z-index: 1;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .option-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
    }

    /* Rank & Selection Control */
    .rank-control {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .radio-box {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #A8A29E;
      background: var(--color-surface);
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
    }

    .option-card.selected .radio-box {
      border-color: var(--color-primary);
      background: var(--color-primary);
    }

    .radio-box::after {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFFFFF;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .option-card.selected .radio-box::after {
      opacity: 1;
    }

    .rank-number {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-muted);
      min-width: 1.25rem;
    }

    /* Restaurant Details (Secondary Hierarchy) */
    .option-details {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .option-header-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .option-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }

    .badge-leader {
      background: var(--color-success-tint);
      color: var(--color-success);
      border: 1px solid rgba(46, 111, 64, 0.2);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
    }

    .option-meta {
      font-size: 0.82rem;
      color: var(--color-muted);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .meta-dot {
      color: #D6D3D1;
    }

    /* Vote Tally Column (Right-Aligned Hierarchy) */
    .vote-tally {
      text-align: right;
      padding-left: 0.75rem;
      border-left: 1px solid rgba(0, 0, 0, 0.06);
      min-width: 68px;
    }

    .vote-pct {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.1;
    }

    .option-card.selected .vote-pct {
      color: var(--color-primary);
    }

    .vote-count {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--color-muted);
      margin-top: 0.15rem;
    }

    /* =========================================
       5. ADD SUGGESTION BAR
       ========================================= */
    .add-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 0.85rem 1rem;
    }

    .add-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 0.5rem;
    }

    .add-form {
      display: flex;
      gap: 0.5rem;
    }

    .add-input {
      flex: 1;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .add-input:focus {
      border-color: var(--color-primary);
      background: var(--color-surface);
    }

    .btn-submit {
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.55rem 1.15rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
    }

    /* =========================================
       6. TOAST FEEDBACK
       ========================================= */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--color-text);
      color: #FFFFFF;
      padding: 0.6rem 1.15rem;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Brand Token Reference Strip -->
  <div class="brand-bar">
    <span class="brand-bar-title">Smart-Casual Palette • Fraunces + Plus Jakarta Sans</span>
    <div class="swatch-group">
      <button class="swatch-btn" onclick="copyHex('#D84315')">
        <span class="swatch-dot" style="background: #D84315;"></span>Terracotta #D84315
      </button>
      <button class="swatch-btn" onclick="copyHex('#B71C1C')">
        <span class="swatch-dot" style="background: #B71C1C;"></span>Crimson #B71C1C
      </button>
      <button class="swatch-btn" onclick="copyHex('#FAF7F2')">
        <span class="swatch-dot" style="background: #FAF7F2;"></span>Alabaster #FAF7F2
      </button>
      <button class="swatch-btn" onclick="copyHex('#1C1917')">
        <span class="swatch-dot" style="background: #1C1917;"></span>Espresso #1C1917
      </button>
    </div>
  </div>

  <main class="container">
    <!-- Top Brand Navigation -->
    <header class="nav-header">
      <div class="logo">
        <span>Table<span class="logo-accent">Vote</span></span>
      </div>
      <div class="timer-badge">
        <span>Closes in</span>
        <span id="timer-display">04:32</span>
      </div>
    </header>

    <!-- Primary Hierarchy: Poll Context & Question -->
    <section class="poll-header">
      <div class="eyebrow">CS Study Group • 22 Members</div>
      <h1 class="poll-question">Where should we grab lunch after the 12:00 PM lecture?</h1>
      <div class="poll-summary-bar">
        <span><span class="summary-strong" id="voted-count">18</span> of 22 students have voted</span>
        <span>1 vote per person</span>
      </div>
    </section>

    <!-- Secondary Hierarchy: Ranked Options List -->
    <div class="section-label">
      <span>Ranked Choices</span>
      <span>Share</span>
    </div>

    <section class="options-list" id="options-list"></section>

    <!-- Add Suggestion Section -->
    <section class="add-box">
      <label class="add-label" for="new-spot-input">Missing a favorite spot?</label>
      <form class="add-form" onsubmit="addOption(event)">
        <input
          type="text"
          id="new-spot-input"
          class="add-input"
          placeholder="Add restaurant or dish (e.g., Cơm Tấm Ba Ghiền)..."
          maxlength="48"
          required
        />
        <button type="submit" class="btn-submit">Add & Vote</button>
      </form>
    </section>
  </main>

  <div class="toast" id="toast">Copied</div>

  <script>
    const totalMembers = 22;
    let userVoteId = 1;

    let options = [
      {
        id: 1,
        name: "Bánh Mì & Iced Coffee",
        meta: "$ • 3 min walk",
        votes: 7,
        voters: ["Minh", "Linh", "Alex", "Sam", "+3"]
      },
      {
        id: 2,
        name: "Korean Fried Chicken & Rice",
        meta: "$$ • 6 min walk",
        votes: 6,
        voters: ["Huy", "Trang", "Jordan", "+3"]
      },
      {
        id: 3,
        name: "Wood-Fired Margherita Pizza",
        meta: "$$ • Group sharing",
        votes: 3,
        voters: ["Khanh", "Taylor", "Devon"]
      },
      {
        id: 4,
        name: "Bún Thịt Nướng Bowls",
        meta: "$ • 5 min walk",
        votes: 2,
        voters: ["Vy", "Chris"]
      }
    ];

    function renderPoll() {
      const listEl = document.getElementById("options-list");
      // Sort dynamically by votes so the hierarchy stays accurate
      const sorted = [...options].sort((a, b) => b.votes - a.votes);
      const totalVotes = sorted.reduce((sum, item) => sum + item.votes, 0);
      const topVotes = sorted.length > 0 ? sorted[0].votes : 0;

      document.getElementById("voted-count").textContent = totalVotes;

      listEl.innerHTML = sorted.map((opt, index) => {
        const pct = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
        const isSelected = opt.id === userVoteId;
        const isLeader = opt.votes === topVotes && opt.votes > 0;

        return `
          <div class="option-card ${isSelected ? 'selected' : ''}" onclick="castVote(${opt.id})">
            <div class="progress-fill" style="width: ${pct}%;"></div>
            <div class="option-grid">
              <div class="rank-control">
                <div class="radio-box"></div>
                <span class="rank-number">#${index + 1}</span>
              </div>

              <div class="option-details">
                <div class="option-header-row">
                  <span class="option-title">${escapeHtml(opt.name)}</span>
                  ${isLeader ? `<span class="badge-leader">Top Choice</span>` : ''}
                </div>
                <div class="option-meta">
                  <span>${escapeHtml(opt.meta)}</span>
                  <span class="meta-dot">•</span>
                  <span>${opt.votes > 0 ? opt.voters.join(', ') : 'No votes yet'}</span>
                </div>
              </div>

              <div class="vote-tally">
                <div class="vote-pct">${pct}%</div>
                <div class="vote-count">${opt.votes} ${opt.votes === 1 ? 'vote' : 'votes'}</div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function castVote(id) {
      if (userVoteId === id) return;

      if (userVoteId !== null) {
        const prev = options.find(o => o.id === userVoteId);
        if (prev && prev.votes > 0) {
          prev.votes--;
          prev.voters = prev.voters.filter(v => v !== "You");
        }
      }

      const next = options.find(o => o.id === id);
      if (next) {
        next.votes++;
        next.voters.unshift("You");
        userVoteId = id;
      }

      renderPoll();
      showToast(`Vote updated: ${next.name}`);
    }

    function addOption(event) {
      event.preventDefault();
      const input = document.getElementById("new-spot-input");
      const name = input.value.trim();
      if (!name) return;

      const newId = Date.now();
      options.push({
        id: newId,
        name: name,
        meta: "Student suggestion",
        votes: 0,
        voters: []
      });

      input.value = "";
      castVote(newId);
    }

    function copyHex(hex) {
      navigator.clipboard.writeText(hex);
      showToast(`Copied ${hex} to clipboard`);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Countdown timer
    let seconds = 272;
    setInterval(() => {
      if (seconds <= 0) return;
      seconds--;
      const m = String(Math.floor(seconds / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      document.getElementById("timer-display").textContent = `${m}:${s}`;
    }, 1000);

    renderPoll();
  </script>
</body>
</html>
