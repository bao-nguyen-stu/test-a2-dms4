<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATELIER TABLE — Minimal Luxury Group Dining Poll</title>

  <!-- Google Fonts: Cormorant Garamond (Editorial Luxury Serif) + Inter (Architectural Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. MINIMAL LUXURY DESIGN TOKENS
       ========================================= */
    :root {
      --color-bg: #F9F8F6;             /* Raw Silk / Gallery Off-White */
      --color-surface: #FFFFFF;        /* Pure Crisp Surface */
      --color-ink: #141312;            /* Deep Obsidian Ink */
      --color-muted: #6E6A66;          /* Warm Taupe Stone */
      --color-subtle: #A39E98;         /* Muted Ash */
      --color-border: #E6E2DC;         /* 1px Architectural Hairline */
      
      --color-primary: #9A2A1E;        /* Oxblood / Chili Red */
      --color-primary-hover: #7D2016;
      --color-primary-tint: #F7ECEA;   /* Whisper-light Rose Tint */
      --color-secondary: #C85A32;      /* Warm Terracotta Accent */
      --color-winner: #2A4B3C;         /* Deep Botanical Sage */

      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --radius: 2px;                   /* Sharp, tailored corners */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-sans);
      line-height: 1.55;
      padding-bottom: 5rem;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       2. MINIMAL TOKEN SPECIMEN BAR
       ========================================= */
    .specimen-bar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0.65rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .swatch-item {
      background: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink);
      cursor: pointer;
      padding: 0.2rem 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .swatch-item:hover {
      border-bottom-color: var(--color-primary);
    }

    .swatch-chip {
      width: 11px;
      height: 11px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    /* =========================================
       3. EDITORIAL CONTAINER & HEADER
       ========================================= */
    .layout {
      max-width: 640px;
      margin: 3.25rem auto 0;
      padding: 0 1.5rem;
    }

    .top-nav {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-ink);
      margin-bottom: 2.75rem;
    }

    .wordmark {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-ink);
    }

    .wordmark span {
      color: var(--color-primary);
    }

    .closing-time {
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-secondary);
    }

    /* Primary Hierarchy: Poll Title */
    .editorial-header {
      margin-bottom: 2.5rem;
    }

    .kicker {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 0.75rem;
    }

    .headline {
      font-family: var(--font-serif);
      font-size: 2.35rem;
      font-weight: 500;
      line-height: 1.15;
      color: var(--color-ink);
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
    }

    .meta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid var(--color-border);
      font-size: 0.8rem;
      color: var(--color-muted);
    }

    .meta-strip strong {
      color: var(--color-ink);
      font-weight: 600;
    }

    /* =========================================
       4. ARCHITECTURAL OPTION ROWS
       ========================================= */
    .table-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-subtle);
      margin-bottom: 0.75rem;
    }

    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 2.25rem;
    }

    .choice-card {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem 1.35rem;
      cursor: pointer;
      transition: border-color 0.25s ease, background-color 0.25s ease;
      user-select: none;
    }

    .choice-card:hover {
      border-color: #B8B2A8;
    }

    .choice-card.selected {
      border-color: var(--color-primary);
      background: linear-gradient(to right, var(--color-primary-tint), var(--color-surface) 38%);
    }

    /* Razor-thin bottom progress line */
    .progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: transparent;
    }

    .progress-bar {
      height: 100%;
      background: var(--color-ink);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .choice-card.selected .progress-bar {
      background: var(--color-primary);
    }

    .choice-layout {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1.25rem;
    }

    /* Minimal Radio & Roman/Index Rank */
    .index-col {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .radio-ring {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid #B5AFA6;
      display: grid;
      place-items: center;
      transition: border-color 0.2s ease;
    }

    .choice-card.selected .radio-ring {
      border-color: var(--color-primary);
    }

    .radio-ring::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
      transform: scale(0);
      transition: transform 0.2s ease;
    }

    .choice-card.selected .radio-ring::after {
      transform: scale(1);
    }

    .rank-num {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--color-subtle);
      min-width: 1.2rem;
    }

    /* Option Content */
    .choice-body {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .choice-name {
      font-family: var(--font-serif);
      font-size: 1.32rem;
      font-weight: 600;
      color: var(--color-ink);
      line-height: 1.2;
    }

    .leading-tag {
      font-family: var(--font-sans);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-winner);
      border-bottom: 1px solid var(--color-winner);
      padding-bottom: 1px;
    }

    .choice-sub {
      font-size: 0.78rem;
      color: var(--color-muted);
      letter-spacing: 0.01em;
    }

    .choice-sub span.sep {
      margin: 0 0.4rem;
      color: var(--color-border);
    }

    /* Right Tally */
    .tally-col {
      text-align: right;
      min-width: 64px;
    }

    .tally-pct {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--color-ink);
      line-height: 1;
    }

    .choice-card.selected .tally-pct {
      color: var(--color-primary);
    }

    .tally-votes {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-subtle);
      margin-top: 0.25rem;
    }

    /* =========================================
       5. TAILORED SUGGESTION INPUT
       ========================================= */
    .propose-section {
      border-top: 1px solid var(--color-border);
      padding-top: 1.5rem;
    }

    .propose-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.65rem;
    }

    .propose-form {
      display: flex;
      gap: 0.75rem;
    }

    .propose-input {
      flex: 1;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.7rem 0.95rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--color-ink);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .propose-input::placeholder {
      color: var(--color-subtle);
    }

    .propose-input:focus {
      border-color: var(--color-ink);
    }

    .btn-luxury {
      background: var(--color-ink);
      color: #FFFFFF;
      border: 1px solid var(--color-ink);
      border-radius: var(--radius);
      padding: 0.7rem 1.35rem;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-luxury:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    /* =========================================
       6. SUBTLE TOAST
       ========================================= */
    .toast {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--color-ink);
      color: #FFFFFF;
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Minimal Palette Specimen Bar -->
  <div class="specimen-bar">
    <span>Minimal Luxury • Cormorant Garamond &amp; Inter</span>
    <div class="swatch-row">
      <button class="swatch-item" onclick="copyHex('#9A2A1E')">
        <span class="swatch-chip" style="background: #9A2A1E;"></span>Oxblood #9A2A1E
      </button>
      <button class="swatch-item" onclick="copyHex('#C85A32')">
        <span class="swatch-chip" style="background: #C85A32;"></span>Terracotta #C85A32
      </button>
      <button class="swatch-item" onclick="copyHex('#F9F8F6')">
        <span class="swatch-chip" style="background: #F9F8F6;"></span>Raw Silk #F9F8F6
      </button>
      <button class="swatch-item" onclick="copyHex('#141312')">
        <span class="swatch-chip" style="background: #141312;"></span>Obsidian #141312
      </button>
    </div>
  </div>

  <main class="layout">
    <!-- Top Editorial Masthead -->
    <header class="top-nav">
      <div class="wordmark">Table<span>.</span>Noir</div>
      <div class="closing-time">
        <span class="status-dot"></span>
        <span>Closes in <span id="timer">04:32</span></span>
      </div>
    </header>

    <!-- Primary Hierarchy: Editorial Question -->
    <section class="editorial-header">
      <div class="kicker">CS Study Cohort &mdash; 22 Guests</div>
      <h1 class="headline">Where shall we gather for lunch following the midday lecture?</h1>
      <div class="meta-strip">
        <span><strong id="voted-total">18</strong> of 22 ballots cast</span>
        <span>Single Selection</span>
      </div>
    </section>

    <!-- Secondary Hierarchy: Ranked Selections -->
    <div class="table-header">
      <span>Curated Selections</span>
      <span>Consensus</span>
    </div>

    <section class="options-stack" id="options-stack"></section>

    <!-- Propose a New Venue -->
    <section class="propose-section">
      <label class="propose-label" for="venue-input">Propose Another Venue</label>
      <form class="propose-form" onsubmit="addVenue(event)">
        <input
          type="text"
          id="venue-input"
          class="propose-input"
          placeholder="Enter restaurant or dish..."
          maxlength="48"
          required
        />
        <button type="submit" class="btn-luxury">Add &amp; Vote</button>
      </form>
    </section>
  </main>

  <div class="toast" id="toast">Copied</div>

  <script>
    let selectedId = 1;

    let venues = [
      {
        id: 1,
        name: "Bánh Mì & Iced Phin Coffee",
        detail: "3 min walk · $",
        votes: 7,
        voters: ["Minh", "Linh", "Alex", "Sam", "+3"]
      },
      {
        id: 2,
        name: "Crispy Korean Fried Chicken",
        detail: "6 min walk · $$",
        votes: 6,
        voters: ["Huy", "Trang", "Jordan", "+3"]
      },
      {
        id: 3,
        name: "Wood-Fired Margherita Pizza",
        detail: "Table sharing · $$",
        votes: 3,
        voters: ["Khanh", "Taylor", "Devon"]
      },
      {
        id: 4,
        name: "Chargrilled Bún Thịt Nướng",
        detail: "5 min walk · $",
        votes: 2,
        voters: ["Vy", "Chris"]
      }
    ];

    function render() {
      const container = document.getElementById("options-stack");
      const sorted = [...venues].sort((a, b) => b.votes - a.votes);
      const total = sorted.reduce((acc, v) => acc + v.votes, 0);
      const highest = sorted.length ? sorted[0].votes : 0;

      document.getElementById("voted-total").textContent = total;

      container.innerHTML = sorted.map((item, idx) => {
        const pct = total > 0 ? Math.round((item.votes / total) * 100) : 0;
        const isSelected = item.id === selectedId;
        const isLeader = item.votes === highest && item.votes > 0;

        return `
          <article class="choice-card ${isSelected ? 'selected' : ''}" onclick="vote(${item.id})">
            <div class="choice-layout">
              <div class="index-col">
                <div class="radio-ring"></div>
                <span class="rank-num">0${idx + 1}</span>
              </div>

              <div class="choice-body">
                <div class="title-line">
                  <h2 class="choice-name">${escapeHtml(item.name)}</h2>
                  ${isLeader ? `<span class="leading-tag">Leading</span>` : ''}
                </div>
                <div class="choice-sub">
                  <span>${escapeHtml(item.detail)}</span>
                  <span class="sep">/</span>
                  <span>${item.votes > 0 ? item.voters.join(', ') : 'Awaiting votes'}</span>
                </div>
              </div>

              <div class="tally-col">
                <div class="tally-pct">${pct}%</div>
                <div class="tally-votes">${item.votes} ${item.votes === 1 ? 'vote' : 'votes'}</div>
              </div>
            </div>

            <div class="progress-track">
              <div class="progress-bar" style="width: ${pct}%;"></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function vote(id) {
      if (selectedId === id) return;

      if (selectedId !== null) {
        const previous = venues.find(v => v.id === selectedId);
        if (previous && previous.votes > 0) {
          previous.votes--;
          previous.voters = previous.voters.filter(name => name !== "You");
        }
      }

      const current = venues.find(v => v.id === id);
      if (current) {
        current.votes++;
        current.voters.unshift("You");
        selectedId = id;
      }

      render();
      notify(`Selected: ${current.name}`);
    }

    function addVenue(e) {
      e.preventDefault();
      const input = document.getElementById("venue-input");
      const name = input.value.trim();
      if (!name) return;

      const id = Date.now();
      venues.push({
        id,
        name,
        detail: "Guest proposal",
        votes: 0,
        voters: []
      });

      input.value = "";
      vote(id);
    }

    function copyHex(hex) {
      navigator.clipboard.writeText(hex);
      notify(`Copied ${hex}`);
    }

    function notify(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    let remaining = 272;
    setInterval(() => {
      if (remaining <= 0) return;
      remaining--;
      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${m}:${s}`;
    }, 1000);

    render();
  </script>
</body>
</html>
